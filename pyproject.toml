[project]
name = "csv-analyst-agent"
version = "0.1.0"
description = "Conversational CSV data analyst on Google Drive, deployed as a Mistral-managed agent (fixed tools, no arbitrary code execution)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mistralai-agents>=1.1.2,<1.2",
]

[tool.mistralai.agents]
entrypoint = "main:agent"
